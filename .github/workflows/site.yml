name: site
on:
  push:
    branches: [main]
    paths: ["site/**", "data/seed/**", "pipeline/out/**", ".github/workflows/site.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install jinja2
      - run: TZ=Asia/Seoul python site/build.py
      - name: 배포 전 sitemap 받아 두기(IndexNow 로 바뀐 페이지만 알리려고)
        run: curl -sfL https://mjgak.com/sitemap.xml -o old-sitemap.xml || true
      - name: dist 브랜치로 배포 (Cloudflare Pages 가 이 브랜치를 서빙)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site/dist
          publish_branch: dist
          cname: mjgak.com
      - name: 바뀐 페이지를 IndexNow 로 알리기(빙 등, 무료)
        continue-on-error: true
        run: sleep 90 && python site/indexnow.py old-sitemap.xml
