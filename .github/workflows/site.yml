name: site
on:
  push:
    branches: [main]
    paths: ["site/**", "data/seed/**", "pipeline/out/**", ".github/workflows/site.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install jinja2
      - run: TZ=Asia/Seoul python site/build.py
      - name: dist 브랜치로 배포 (Cloudflare Pages 가 이 브랜치를 서빙)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site/dist
          publish_branch: dist
          cname: mjgak.com
